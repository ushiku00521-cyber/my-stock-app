YAML
name: Daily Stock Screener Batch

on:
  schedule:
    - cron: '0 7 * * 1-5' # 平日 JST 16:00 (UTC 07:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/parent-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Screener Pipeline
        run: python pipeline.py

      - name: Commit & Push updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add latest_ranking.csv
          git commit -m "auto: update daily stock rankings" || exit 0
          git push
